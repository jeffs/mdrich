[package]
name = "mdrich"
version = "0.1.0"
edition = "2024"
description = "Render Markdown from stdin onto the macOS pasteboard as rich text"
license = "Apache-2.0"

[dependencies]
comrak = { version = "0.52", default-features = false }
htmd = "0.5.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSData"] }
serde_json = "1.0.151"

[lints.clippy]
pedantic = "deny"
